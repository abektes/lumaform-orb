name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Plain Node scripts, no test framework. scripts/run-tests.mjs walks every
      # workspace's tests/ and propagates a non-zero exit — a shell for-loop
      # swallowed them and reported success on a red suite.
      - run: npm test

      - run: npm run build

      # The suite runs against src/, where every path resolves because the
      # repository is right there. This packs the tarball, installs it into a
      # scratch project and imports every declared subpath from outside the
      # workspace — a `files` omission or a workspace-only export path is
      # otherwise invisible until after publish, and a spent version cannot be
      # unspent.
      - run: npm run verify:package
