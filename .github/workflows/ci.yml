name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Plain Node scripts, no test framework. scripts/run-tests.mjs walks every
      # workspace's tests/ and propagates a non-zero exit — a shell for-loop
      # swallowed them and reported success on a red suite.
      - run: npm test

      - run: npm run build
