<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>@lumaform/orb embed example</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 1.5rem;
        background: radial-gradient(circle at 50% 40%, #1b2233, #0b0d12 70%);
        color: #d8dce6;
        font: 15px/1.5 system-ui, sans-serif;
      }
      /* The orb fills this element, so it needs a size. */
      #orb {
        width: min(70vmin, 420px);
        aspect-ratio: 1;
      }
      .controls {
        display: flex;
        gap: 0.75rem;
      }
      button {
        background: #1c2230;
        color: #e6e9f0;
        border: 1px solid #2c3446;
        border-radius: 6px;
        padding: 0.5rem 0.9rem;
        font: inherit;
        cursor: pointer;
      }
      button[aria-pressed='true'] {
        background: #2f3d5c;
        color: #ffffff;
      }
    </style>
  </head>
  <body>
    <div id="orb"></div>
    <div class="controls">
      <button id="tone" aria-pressed="false">Silent test tone</button>
      <button id="mic" aria-pressed="false">Microphone</button>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
